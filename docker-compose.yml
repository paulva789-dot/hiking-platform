# Spins up just the database. Run the API and the frontend on the host with
# `npm run dev` in each folder — you want their hot reload during development.
#
#   docker compose up -d
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: trek-cameroon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trek_cameroon
    ports:
      # Host port 5433, not 5432 — this machine already runs another
      # project's Postgres on 5432. Keep DATABASE_URL in backend/.env in
      # sync with this (localhost:5433).
      - '5433:5432'
    volumes:
      - trek_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trek_cameroon']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trek_pgdata:
